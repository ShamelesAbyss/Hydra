[package]
name = "hydra"
version = "1.7.0-alpha.14"
edition = "2021"
authors = ["Emergent Labs"]
description = "HYDRA — Project Leviathan: native Hyperliquid trading engine"
license = "MIT"

[[bin]]
name = "hydra"
path = "src/main.rs"

[lib]
name = "hydra"
path = "src/lib.rs"

[[bin]]
name = "hydra-cockpit"
path = "src/bin/hydra-cockpit.rs"
required-features = ["desktop"]

[features]
desktop = ["dep:eframe"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1
debug = 1

[dependencies]
eframe = { version = "=0.35.0", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "fs", "io-util", "process"] }
async-trait = "0.1"
futures = "0.3"
clap = { version = "4", features = ["derive", "env", "color"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "time", "local-time"] }
tracing-appender = "0.2"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "gzip"] }
rusqlite = { version = "0.43", default-features = false, features = ["bundled", "chrono", "serde_json"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
dotenvy = "0.15"
rust_decimal = { version = "1.43", features = ["serde-with-float"] }
rust_decimal_macros = "1"
owo-colors = { version = "4", features = ["supports-colors"] }
comfy-table = "7"
ctrlc = { version = "3", features = ["termination"] }
once_cell = "1"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
secp256k1 = { version = "0.33.1", features = ["recovery"] }
sha3 = "0.10"
rmp-serde = "1"
ratatui = { version = "0.30.2", default-features = false, features = ["std", "crossterm_0_28", "underline-color", "layout-cache"] }
crossterm = "0.28"

[dev-dependencies]
tempfile = "3"
