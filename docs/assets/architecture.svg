width="504" height="104" rx="10" fill="#0F1C29" stroke="#26D9FF" stroke-opacity=".6"/><text x="52" y="266" fill="#26D9FF" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">TRADING ENGINE / Rust + Tokio</text><text x="52" y="289" fill="#A7BBCC" font-family="Segoe UI,Arial,sans-serif" font-size="12" >Strategies → context → risk → durable intent</text><text x="52" y="318" fill="#A7BBCC" font-family="Segoe UI,Arial,sans-serif" font-size="12" >Hyperliquid adapter · account ownership · protective exits</text><rect x="580" y="238" width="504" height="104" rx="10" fill="#0F1C29" stroke="#FF81CD" stroke-opacity=".6"/><text x="596" y="266" fill="#FF81CD" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">RESEARCH / Oracle + Genesis</text><text x="596" y="289" fill="#A7BBCC" font-family="Segoe UI,Arial,sans-serif" font-size="12" >Candle replay → seeded search → Pareto candidates</text><text x="596" y="318" fill="#A7BBCC" font-family="Segoe UI,Arial,sans-serif" font-size="12" >Explicit simulation limits · no automatic deployment</text><rect x="36" y="405" width="504" height="69" rx="10" fill="#0F1C29" stroke="#29F0B4" stroke-opacity=".6"/><text x="52" y="433" fill="#29F0B4" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">SQLite / LOCAL EVIDENCE</text><text x="52" y="456" fill="#A7BBCC" font-family="Segoe UI,Arial,sans-serif" font-size="12" >Positions · intents · exact facts · fills/funding · risk</text><rect x="580" y="405" width="504" height="69" rx="10" fill="#0F1C29" stroke="#48A8FF" stroke-opacity=".6"/><text x="596" y="433" fill="#48A8FF" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">Hyperliquid / EXTERNAL VENUE</text><text x="596" y="456" fill="#A7BBCC" font-family="Segoe UI,Arial,sans-serif" font-size="12" >Info reads · gated signed execution</text><path d="M196 179V205H18V440H36" stroke="#29F0B4" fill="none" stroke-width="1.5" stroke-dasharray="4 5"/><path d="M560 179V205H28