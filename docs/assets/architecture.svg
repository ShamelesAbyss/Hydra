  <path d="M206 206 H580 V232" stroke="#B374FA" stroke-width="1.5" fill="none"/>
  <path d="M206 206 H954 V232" stroke="#F6BC53" stroke-width="1.5" fill="none"/>
  <path d="M580 180 V206" stroke="#36CDF5" stroke-width="1.5" fill="none"/>
  <path d="M954 180 V206" stroke="#3AE8A5" stroke-width="1.5" fill="none"/>
  <path d="M206 346 V406" stroke="#3AE8A5" stroke-width="1.6" fill="none"/>
  <path d="M376 289 H393 V374 H760 V406" stroke="#4997FF" stroke-width="1.6" fill="none"/>
  <path d="M954 346 V406" stroke="#F6BC53" stroke-width="1.5" fill="none" stroke-dasharray="4 4"/>
  <path d="M954 374 H480 V406" stroke="#F6BC53" stroke-width="1.3" fill="none" stroke-dasharray="3 4"/>
</svg>
