# Strategy configuration — SMALL-SCALE STARTER.
# Optimised for $50–$300 starting USDC on Hyperliquid perps.
# Switch to config/strategies-balanced.toml once you're above ~$1k equity.

[global]
enabled_strategies = ["divergence", "momentum", "mean_reversion"]
enabled_venues     = ["hyperliquid"]   # single-venue: Hyperliquid covers 180+ perps
default_symbols    = ["ETH", "BTC", "HYPE", "SOL"]
candle_interval    = "1m"
lookback_candles   = 240
regime_required    = true

# With 1% risk per trade on $100 equity, risk_budget ≈ $1.
# position_frac=1.0 means the full budget translates to size — so notional
# clears the $10 HL minimum on every signal.
[divergence]
enabled        = true
rsi_period     = 14
rsi_threshold  = 5.0
min_edge_bps   = 8
position_frac  = 1.0

[momentum]
enabled          = true
fast_ema         = 12
slow_ema         = 48
atr_period       = 14
breakout_lookback = 60
min_atr_pct      = 0.18
position_frac    = 1.0

[mean_reversion]
enabled        = true
bb_period      = 20
bb_std         = 2.2
rsi_floor      = 28
rsi_ceiling    = 72
position_frac  = 1.0

[regime]
trend_ema_period   = 96
chop_atr_threshold = 0.08
panic_atr_threshold = 1.20
vol_spike_mult     = 2.5

[position_management]
# v1.6.1 stop & TP retune — fixed sub-3-min stop-outs on HYPE/low-ATR markets.
# Old: 1.8 / 2.6 (R:R 1.44, ATR-only stop, no noise floor).
# New: 2.5 / 4.5 (R:R 1.8, ATR-or-noise-floor stop, 6h time stop).
# The chandelier defense at 0.8R still locks in profits — winners can run
# to 4.5×ATR target while losers cap at 2.5×ATR + chandelier.
stop_loss_atr_mult   = 2.5
take_profit_atr_mult = 4.5
trailing_enabled     = true
trailing_atr_mult    = 1.2
time_stop_minutes    = 360         # was 180 — let trades develop fully
partial_tp_enabled   = true
partial_tp_fraction  = 0.5
# v1.5.3 retune — chandelier loosened from 0.7 → 0.8R. The v1.4.5 sweet
# spot was right when the bot was running tight; with the v1.5 adaptive
# brain dynamically reining in losers, winners should be allowed more
# breathing room before BE-locking. Lets profitable trades reach TP more
# often. Still well above the v1.3.2 over-strangling 0.5R baseline.
breakeven_trigger_r  = 0.8
chandelier_trail_r   = 0.8
# v1.6.1 noise-floor stop. ATR-only stops on low-ATR markets like HYPE
# (typical ATR 0.05-0.10%) put the stop INSIDE the bid/ask spread band.
# Random tick walks took us out within minutes. The floor guarantees
# stop is at least max(4 × spread, 25bps × entry) — breathable on every
# market, without altering high-ATR markets where 1.8×ATR > 25bps anyway.
min_stop_bps             = 25.0
# v1.6.1 stop-out cooldown. STACKS on top of `[filters].reentry_cooldown`.
# After a stop-out, the SAME (symbol, side) is blocked for this many minutes
# regardless of intervening wins. Specifically prevents the chop-death
# pattern observed in 16h log replays on HYPE.
stopout_cooldown_minutes = 45

[filters]
# v1.5.3 retune — calibrated for "adaptively strict, not blanket strict".
# The v1.5 brain now handles per-symbol/per-strategy strictness dynamically,
# so the global gates can be a touch more permissive without bleeding.
reentry_cooldown_minutes = 30        # was 45 — the brain tracks losing setups
                                     # via memory-block now, so a flat 45m
                                     # global cooldown was double-jeopardy.
trend_filter_enabled     = true
trend_filter_ema_period  = 240
trend_filter_band_pct    = 0.4       # was 0.3 — wider deadband stops the
                                     # trend filter from blocking valid
                                     # mean-reversion signals on small drift.
# v1.5.3 — edge gate down 2bps. HL round-trip fees ≈ 7bps + typical spread
# 1-2bps = 9bp cost floor. 10bp gives +1bp safety margin and lets the brain's
# adaptive edge-override (±a few bps based on recent expectancy) actually
# move the gate in BOTH directions. v1.4.5 had this at 12bps; 14-17bps real
# signals now have headroom over the gate AND headroom for the brain.
min_net_edge_bps         = 10.0
# At $30 notional, 7bp fee = $0.021. A $0.20 win is 9.5x the fee cost.
# Below $30 the fee economics break down regardless of edge.
min_notional_usd         = 25.0

# ─── v1.4.0 per-symbol overrides ─────────────────────────────────────────────
# Tuned from real Apr 25-26 trading data (12 fills): BTC was the strongest
# performer (67% win, +$0.019 expectancy), ETH was scratch (44%, +$0.001),
# HYPE never traded due to the size-precision bug (now fixed).
#
# Each symbol may override: position_frac_mult (size scaler, clamped 0.1–2.0),
# max_spread_bps (spread tolerance), max_notional_usd (per-trade notional
# cap), default_risk_pct (risk-budget %). Symbols not listed here use the
# global defaults from .env / the [risk] section.
#
# To add a new symbol from any HL perp (the universe has 180+):
#   1. Add it to default_symbols above (or pass via --symbols on launch).
#   2. (Optional) Add a [per_symbol.<TICKER>] block below with overrides.
#   3. Restart. The adapter auto-fetches per-asset szDecimals so precision
#      is handled by the venue's metadata, not hand-tuned per token.
[per_symbol.BTC]
position_frac_mult = 1.30   # best win-rate symbol gets +30% size

[per_symbol.ETH]
position_frac_mult = 1.00   # baseline — keep allocation as-is

[per_symbol.HYPE]
position_frac_mult = 0.70   # newer / less liquid → smaller size until proven
max_spread_bps     = 35     # HYPE spreads run 1-3bps in normal markets,
                            # but spike to 8-15bps during news flow; 35 keeps
                            # it tradeable without chasing during chaos

[per_symbol.SOL]
position_frac_mult = 0.90   # mid-cap profile: slightly conservative until
                            # we see live data; deeper liquidity than HYPE
                            # but choppier than BTC/ETH historically
max_spread_bps     = 30     # SOL spreads are typically 1-2bps but widen
                            # to 5-10bps on hot moves; 30 is a fair ceiling

# ─── v1.5.0 adaptive learning ───────────────────────────────────────────────
# The bot learns from its own closed trades. Three subsystems all feed into
# one `SignalDecision` consumed by the risk engine:
#
#   1. Self-Tuning (Tier A): rolling expectancy per symbol/strategy drives
#      a position-size multiplier in [0.5, 1.5]. Winning buckets size up,
#      losing buckets size down. Confidence-weighted; small samples revert
#      toward a neutral 1.0×.
#   2. Regime Brain (Option 1): multi-timeframe regime classifier (1m/5m/15m).
#      Per-(regime, symbol, strategy) expectancy table tells the bot which
#      strategy works in which regime, weighted by 3-TF agreement.
#   3. Memory Bot (Option 3): every trade closes with a feature vector
#      (atr, spread, edge, regime, hour, day). At signal time we run a
#      similarity search (k-NN, k=20) and surface a verdict. If 10+ similar
#      past trades had win-rate < 30% AND net-pnl < 0, the signal is HARD
#      blocked. All thresholds tunable below.
#
# Set enabled = false to turn the entire system off (legacy v1.4.x behaviour).
#
# ─── v1.6.0 adaptive strictness (new) ──────────────────────────────────────
# Three coordinated overrides that prevent the bot from starving in
# dead/drifting markets while preserving every safety gate:
#
#   A. ATR-aware scaling: when ATR% is crushed (sleeping market), the
#      `min_net_edge_bps` gate is loosened by a few bps and the trend-filter
#      deadband widened. When ATR is hot, gates tighten back. Pure function
#      of current snapshot.
#   B. Drought detector: counts trend-filter blocks per symbol over a
#      rolling window. After N blocks with zero fills, auto-bypass the
#      trend filter for that symbol for M hours. Cleared on any fill.
#   C. ε-greedy exploration: every Nth signal that ONLY fails the trend
#      filter is taken anyway, downsized to 0.5×. Pure data-collection
#      trades, logged distinctly as "explored:".
#
[learning]
enabled                  = true   # master switch (Tier A + Regime + Memory)
memory_block_enabled     = true   # if false, memory becomes informational-only
memory_min_matches       = 10     # min similar past trades before block fires
memory_block_winrate_pct = 30     # block when winrate < this AND net_pnl < 0
size_mult_enabled        = true   # apply [0.5, 1.5] mult from expectancy
edge_override_enabled    = true   # adaptive edge-threshold delta (±a few bps)

# v1.6.0 strictness — turn each subsystem on/off independently.
strictness_enabled       = true   # master switch for all three below
atr_aware_scaling        = true   # scale gate + band based on current ATR%
drought_detector         = true   # auto-bypass trend filter on losing-block streaks
drought_block_threshold  = 5      # blocks within window before bypass triggers
drought_window_hours     = 4      # rolling window for the block count
drought_bypass_hours     = 2      # how long the bypass lasts (cleared on fill)
explore_enabled          = true   # take 1-in-N trend-blocked signals as data
explore_one_in_n         = 8      # 1 of every N trend-only blocks gets retried
explore_size_factor      = 0.5    # at half size; bounded [0.25, 1.0]
