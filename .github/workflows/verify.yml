name: Verify and package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --features desktop-wgpu --all-targets
      - run: cargo build --locked --release --features desktop-wgpu --bin hydra-cockpit
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Preserve permanent memorial dedication
        shell: pwsh
        run: ./.github/scripts/verify-memorial.ps1
      - name: Enforce GitHub distribution compliance
        shell: pwsh
        run: ./.github/scripts/verify-github-compliance.ps1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --release
      - name: Verify CLI launch
        shell: bash
        run: ./target/release/hydra${{ runner.os == 'Windows' && '.exe' || '' }} --version
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit --locked
      - run: cargo audit
